version: '3.9'

services:
  web:
    container_name: 'django-app'
    build: .
    ports:
      - 8001:8001
    volumes:
      - django_todo_volume:/app
  
  mydb:
    container_name: 'mysql'
    image: mysql:latest
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: 'paritosh'    
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  django_todo_volume:  
  mysql_data:  
